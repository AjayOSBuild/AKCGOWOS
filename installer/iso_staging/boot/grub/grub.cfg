set default=0
set timeout=10

menuentry "Install Nexus OS (Conservative Mode)" {
    echo "Loading kernel..."
    linux /boot/vmlinuz console=ttyS0 console=tty0 loglevel=3 nexus_install=1
    echo "Loading initramfs..."
    initrd /boot/initramfs.img
}

menuentry "Nexus OS Recovery / Safe Mode" {
    echo "Loading kernel..."
    linux /boot/vmlinuz console=ttyS0 console=tty0 loglevel=7 single
    echo "Loading initramfs..."
    initrd /boot/initramfs.img
}
